  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมุดเยี่ยม</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
  <style>
    :root { --ink: #1b2432; --muted: #5b6472; --line: #e2e8e4; --green: #16a34a; --green-deep: #15803d; --paper: #f3f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; color: var(--ink); background: var(--paper); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--green); color: #fff; display: grid; place-items: center; font-weight: 700; }
    h1 { font-size: 24px; margin: 0; }
    .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 6px; }
    input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid #c4cfc8; border-radius: 10px; background: #fff; }
    textarea { min-height: 96px; resize: vertical; }
    button { margin-top: 14px; width: 100%; min-height: 46px; border: 0; border-radius: 12px; background: var(--green); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 10px; font-size: 14px; min-height: 20px; }
    .msg.err { color: #b91c1c; }
    .msg.ok { color: var(--green-deep); }
    h2 { font-size: 16px; margin: 24px 0 10px; color: var(--muted); font-weight: 600; }
    .entry { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .entry .who { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
    .entry .who b { color: var(--ink); }
    .entry p { margin: 6px 0 0; white-space: pre-wrap; line-height: 1.6; }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 18px; }
    footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">✎</div>
      <div>
        <h1>สมุดเยี่ยม</h1>
        <p class="sub">ลงชื่อ ฝากข้อความไว้ บันทึกลง Google Sheets ของเจ้าของแอป</p>
      </div>
    </header>

    <form class="card" id="form">
      <label for="name">ชื่อของคุณ</label>
      <input id="name" name="name" maxlength="60" placeholder="เช่น สมชาย" required>
      <label for="message">ข้อความ</label>
      <textarea id="message" name="message" maxlength="500" placeholder="อยากบอกอะไรกับเจ้าของแอป…" required></textarea>
      <button type="submit" id="submit">ฝากข้อความ</button>
      <div class="msg" id="msg" role="status"></div>
    </form>

    <h2>ข้อความล่าสุด</h2>
    <div id="list"><div class="empty">กำลังโหลด…</div></div>

    <footer>สร้างด้วย EasyGAS IDE · ข้อมูลอยู่ใน Google Sheets ของเจ้าของแอป</footer>
  </div>

  <script>
    var form = document.getElementById('form');
    var msg = document.getElementById('msg');
    var list = document.getElementById('list');
    var submit = document.getElementById('submit');

    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    function render(entries) {
      if (!entries || !entries.length) { list.innerHTML = '<div class="empty">ยังไม่มีข้อความ เป็นคนแรกได้เลย</div>'; return; }
      list.innerHTML = entries.map(function (e) {
        return '<div class="entry"><div class="who"><b>' + esc(e.name) + '</b><span>' + esc(e.time) + '</span></div><p>' + esc(e.message) + '</p></div>';
      }).join('');
    }

    function say(text, kind) { msg.textContent = text || ''; msg.className = 'msg' + (kind ? ' ' + kind : ''); }

    function load() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(function () { list.innerHTML = '<div class="empty">โหลดข้อความไม่สำเร็จ ลองรีเฟรช</div>'; })
        .listEntries();
    }

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var payload = { name: form.name.value, message: form.message.value };
      submit.disabled = true;
      say('กำลังบันทึก…');
      google.script.run
        .withSuccessHandler(function (r) {
          submit.disabled = false;
          if (!r || !r.ok) { say((r && r.error) || 'บันทึกไม่สำเร็จ', 'err'); return; }
          form.message.value = '';
          say('บันทึกแล้ว ขอบคุณครับ', 'ok');
          render(r.entries);
        })
        .withFailureHandler(function (e) { submit.disabled = false; say('บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : 'ลองใหม่อีกครั้ง'), 'err'); })
        .addEntry(payload);
    });

    load();
  </script>
</body>
</html>
